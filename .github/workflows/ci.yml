name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep builds reproducible and caches valid across toolchain updates.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match `rust-version` in Cargo.toml. cargo_metadata 0.23 sets the
      # floor at 1.86.
      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Test on the minimum supported rust version
        run: cargo test --locked --all-targets

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify the crate packages cleanly
        run: cargo package --locked

      # `cargo package` writes both target/package/<name>-<version>/ and a
      # sibling .crate file, so select the directory rather than globbing both.
      - name: Verify the packaged crate builds, installs and passes its tests
        run: |
          packaged="$(find target/package -maxdepth 1 -type d -name 'cargo-remote-3000-*')"
          echo "testing $packaged"
          cargo test --locked --manifest-path "$packaged/Cargo.toml"
          cargo install --locked --path "$packaged" --root /tmp/probe
          /tmp/probe/bin/cargo-remote-3000 --version
          /tmp/probe/bin/cargo-remote-3000 remote-3000 --help > /dev/null