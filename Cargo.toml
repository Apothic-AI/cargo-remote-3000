[package]
name = "cargo-remote-3000"
description = "Cargo subcommand to build Rust projects on a remote build server over SSH"
keywords = ["remote", "build", "ssh", "rsync", "offload"]
categories = ["command-line-utilities", "development-tools::build-utils"]
version = "0.4.0"
authors = ["Sebastian Geisler <sgeisler@wh2.tu-dresden.de>", "Apothic AI <hello@apothic.ai>"]
license = "MIT"
repository = "https://github.com/Apothic-AI/cargo-remote-3000"
homepage = "https://github.com/Apothic-AI/cargo-remote-3000"
edition = "2021"
# cargo_metadata 0.23 requires 1.86. The CI msrv job runs this exact version.
rust-version = "1.86"
readme = "README.md"

[[bin]]
name = "cargo-remote-3000"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# cargo_metadata returns `camino::Utf8Path`; this converts it to `std::path`.
camino = { version = "1.2", default-features = false }
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
dirs = "7"
env_logger = "0.11"
log = "0.4"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
